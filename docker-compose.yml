services:
  postgres:
    image: postgres:16
    container_name: minesweeper-postgres
    environment:
      POSTGRES_DB: minesweeper
      POSTGRES_USER: minesweeper
      POSTGRES_PASSWORD: minesweeper
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: [ CMD-SHELL, "pg_isready -U minesweeper -d minesweeper" ]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
